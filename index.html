<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idle Fantacia</title>
<link rel="stylesheet" href="style.css?v=59">
</head>
<body>

<!-- Profile select -->
<div id="screen-profiles" class="screen active">
  <div>
    <div class="game-title">✨ Idle Fantacia</div>
  </div>
  <div class="game-subtitle">ป่ามายาที่เวลาหยุดรอคุณ — แต่งานยังเดินต่อ (สูงสุด 8 ชม. ได้ 30%) — เลือกนักผจญภัยของคุณ</div>
  <div id="storage-warning" class="storage-warning" style="display:none"></div>
  <div id="save-location" class="save-location" style="display:none"></div>
  <div id="profile-row" class="profile-row"></div>
</div>

<!-- Game -->
<div id="screen-game" class="screen">
  <!-- 🎯 [added 2026-08-19] On a phone the 240px sidebar left ~150px for the game itself, so it
       becomes a slide-in drawer below 760px. The backdrop is a sibling rather than a ::before so a
       tap anywhere outside can close it. Both are inert (display:none) on desktop. -->
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
  <div class="sidebar" id="sidebar">
    <div class="brand">✨ Idle Fantacia</div>
    <div id="skill-tabs"></div>
    <div class="spacer"></div>
    <div class="save-box">
      <div id="save-when">ยังไม่เคยเซฟ</div>
      <button id="btn-save" class="btn small">💾 เซฟตอนนี้</button>
      <button id="btn-exit" class="btn ghost small" style="margin-top:6px">ออกไปหน้าโปรไฟล์</button>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <button id="menu-chip" class="menu-chip" aria-label="เมนู" aria-expanded="false">☰</button>
      <h2 id="skill-title"></h2>
      <div class="flavor" id="skill-flavor"></div>
      <!-- Rendered by the React shell (dist/ui.js). Left empty rather than pre-filled so there is
           no flash of stale numbers before the first sync. Without the bundle the topbar is simply
           bare — the game itself still plays, which is the property the legacy paths preserve. -->
      <div class="vitals" id="vitals-root"></div>
    </div>

    <div id="pause-bar" class="pause-bar" style="display:none">
      ⏸️ <b>พักอยู่</b> — เวลาในเกมหยุดสนิท งาน แปลงปลูก ปฏิทิน และการต่อสู้ไม่เดินต่อจนกว่าจะกดเล่นต่อ
    </div>
    <div id="active-banner" class="active-banner"></div>

    <div id="view-extra"></div>
    <!-- Skill action cards, rendered by the React shell. A separate container from #action-grid so
         the two renderers never share one element: every other view (shop, combat, guild, the farm)
         still draws into #action-grid from game.js, and neither can wipe the other's DOM. -->
    <div id="skill-grid-root"></div>
    <div id="action-grid" class="action-grid"></div>

    <div id="bag-panel" style="display:none">
      <div id="inv-tabs" class="inv-tabs"></div>
      <div id="inv-grid" class="inv-grid"></div>
    </div>
  </div>
</div>

<div id="toasts"></div>

<!-- Sound, synthesised at runtime rather than shipped as files — see the note at the top of
     audio.js. Loaded before game.js because toast() reaches for it. -->
<!-- i18n.js before data.js and game.js: it holds the dictionary they are translated through,
     and initLang() runs before the first render so nothing is drawn twice. -->
<script src="i18n.js?v=59"></script>
<script src="audio.js?v=59"></script>
<!-- Keeps the screen awake where the Wake Lock API is not allowed — see the note at the top of
     nosleep.js. Needed because the LAN address is plain http, which is not a secure context. -->
<script src="nosleep.js?v=59"></script>
<script src="data.js?v=59"></script>
<script src="game.js?v=59"></script>
<!-- The React + MUI shell. Loaded after game.js because it reads window.__game, which game.js
     defines. Absent bundle = the legacy sidebar in game.js still runs, so a bare checkout with no
     node_modules still plays. Rebuild with:  npm --prefix ui run build -->
<script src="dist/ui.js?v=59"></script>
</body>
</html>
